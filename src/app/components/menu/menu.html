<button class="hamburger-btn" (click)="toggleMenu()" type="button" aria-label="Abrir Menu">
  <span class="bar"></span>
  <span class="bar"></span>
  <span class="bar"></span>
</button>

<div class="menu-overlay" *ngIf="menuAberto" (click)="toggleMenu()"></div>

<aside class="sidebar" [class.active]="menuAberto">
  <div class="sidebar-brand">
    <img src="assets/images/ford.png" alt="Ford" class="logo">
  </div>

  <nav class="sidebar-nav">
    <a class="nav-item" (click)="irPara('home')">
      <span>Home</span>
    </a>
    <a class="nav-item" (click)="irPara('dashboard')">
      <span>Dashboard</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="btn-logout" type="button" (click)="logout()">
      <span>Sair</span>
    </button>
  </div>
</aside>
