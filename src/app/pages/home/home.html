<div class="home-layout">
  <button class="hamburger-btn" type="button" (click)="toggleMenu()" aria-label="Abrir menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <div class="menu-overlay" *ngIf="menuAberto" (click)="toggleMenu()"></div>

  <aside class="sidebar" [class.active]="menuAberto">
    <div class="sidebar-brand">
      <img src="images/ford.png" alt="Ford" class="logo">
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item active" (click)="irParaHome()">
        <span>Home</span>
      </a>
      <a class="nav-item" (click)="irParaDashboard()">
        <span>Dashboard</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" type="button" (click)="logout()">
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <h2>Painel de Controle</h2>
      <div class="user-profile">
        <span>Administrador</span>
      </div>
    </header>

    <section class="hero-section">
      <div class="welcome-card">
        <span class="badge">Acesso Concedido</span>
        <h1>Seja bem-vindo ao Ford Enterprise System</h1>
        <p>Acompanhe métricas em tempo real, gerencie telemetria avançada e atualizações de software da sua frota conectada.</p>
        
        <a class="btn-primary-action" (click)="irParaDashboard()">
          Acessar Dashboard
        </a>
      </div>
    </section>
  </main>
</div>
