<div class="dashboard-layout">
  <!-- Header do Dashboard -->
  <header class="dash-header">
    <div class="header-title">
      <img src="assets/images/ford.png" alt="Ford" class="header-logo">
      <h1>Dashboard FORD</h1>
    </div>
    <div class="header-status">
      <span class="status-indicator"></span> Sistema Conectado
    </div>
  </header>

  <div class="dash-container">
    <!-- Grade Superior: Select + 3 KPI Cards -->
    <section class="kpi-grid">
      <!-- Filtro Modelo -->
      <div class="card filter-card">
        <label for="vehicle-select">Modelo do Veículo</label>
        <div class="select-custom">
          <select id="vehicle-select">
            <option value="mustang">Mustang</option>
            <option value="broncoSport">Bronco Sport</option>
            <option value="ranger">Ranger</option>
            <option value="territory">Territory</option>
          </select>
        </div>
      </div>

      <!-- KPI 1 -->
      <div class="card kpi-card">
        <div class="kpi-info">
          <span class="kpi-title">Total de Vendas</span>
          <span class="kpi-value">1.500</span>
        </div>
      </div>

      <!-- KPI 2 -->
      <div class="card kpi-card">
        <div class="kpi-info">
          <span class="kpi-title">Conectados</span>
          <span class="kpi-value">500</span>
        </div>
      </div>

      <!-- KPI 3 -->
      <div class="card kpi-card">
        <div class="kpi-info">
          <span class="kpi-title">Update Software</span>
          <span class="kpi-value font-cyan">350</span>
        </div>
      </div>
    </section>

    <!-- Visualização Central do Carro -->
    <section class="vehicle-display">
      <div class="vehicle-stage">
        <img src="assets/images/mustang.png" alt="Mustang" class="active-vehicle">
        <div class="vehicle-shadow"></div>
      </div>
    </section>

    <!-- Tabela de Detalhes Telemetria -->
    <section class="table-card">
      <div class="table-header">
        <h3>Telemetria da Frota</h3>
        <div class="search-box">
          <input type="text" placeholder="Buscar por Código VIN (ex: 2FRH...)" class="search-input">
        </div>
      </div>

      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>Código VIN</th>
              <th>Odômetro</th>
              <th>Nível de Combustível</th>
              <th>Status do Óleo</th>
              <th>Lat</th>
              <th>Long</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="vin-code">2FRHDUYS2Y63NHD22454</td>
              <td>54.200 km</td>
              <td>
                <div class="progress-bar-container">
                  <div class="progress-fill" style="width: 78%;"></div>
                  <span>78%</span>
                </div>
              </td>
              <td><span class="badge-status ok">98% (OK)</span></td>
              <td>-12.9711</td>
              <td>-38.5108</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>
