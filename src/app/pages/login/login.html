<div class="login-container">
  <div class="login-banner">
    <span class="brand-tag">Veículos Ford</span>
    <h2>Inovação & Performance</h2>
    <p>Gerenciamento inteligente de frota conectada.</p>
  </div>

  <div class="login-form-container">
    <div class="login-header">
      <h3>Boas-vindas</h3>
      <p>Acesse com suas credenciais do sistema</p>
    </div>

    @if (mensagemErro) {
      <div class="error-message">
        {{ mensagemErro }}
      </div>
    }

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="usuario">Usuário</label>
        <input 
          type="text" 
          id="usuario" 
          name="nome" 
          class="form-control" 
          [(ngModel)]="usuario.nome" 
          placeholder="Digite seu usuário" 
          required
        >
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input 
          type="password" 
          id="senha" 
          name="senha" 
          class="form-control" 
          [(ngModel)]="usuario.senha" 
          placeholder="••••••••" 
          required
        >
      </div>

      <button type="submit" class="btn-primary">Entrar no Sistema</button>
    </form>
  </div>
</div>
